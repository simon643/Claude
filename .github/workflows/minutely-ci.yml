name: minutely CI

# Same shape as xerobk-ci.yml: no `branches:` filter, because the sibling
# ci.yml filters on `main`, which does not exist in this repository. Matching
# on paths keeps this working whatever the default branch is called, and only
# spends CI time when minutely actually changes.
on:
  push:
    paths:
      - "meeting-minutes/**"
      - ".github/workflows/minutely-ci.yml"
  pull_request:
    paths:
      - "meeting-minutes/**"
      - ".github/workflows/minutely-ci.yml"
  workflow_dispatch:

concurrency:
  group: minutely-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: meeting-minutes

# A branch with an open PR matches both `push` and `pull_request`, so every job
# would otherwise run twice on the same commit. Skipping push events on
# non-default branches leaves `pull_request` covering feature branches.
# (Repeated per job: the `env` context is not available in a job-level `if`.)

jobs:
  test:
    if: >-
      github.event_name != 'push'
      || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches requires-python = ">=3.11,<3.14" in meeting-minutes/pyproject.toml.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: meeting-minutes/pyproject.toml

      # minutely declares zero runtime dependencies on purpose. Installing only
      # the dev tools here is the check that it stayed that way — in
      # particular, that nothing outside engines/claude.py reaches for the
      # optional anthropic package.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy src

      - name: Test
        run: pytest -q

      # Unit tests import the package directly and would still pass if the
      # console script or the bundled demo transcript were missing from the
      # installed wheel. This exercises the entry point end to end.
      - name: CLI smoke test
        env:
          MINUTELY_HOME: ${{ runner.temp }}/minutely-home
        run: |
          minutely --version
          minutely demo --json > /tmp/demo.json
          python -c "import json,sys; d=json.load(open('/tmp/demo.json')); sys.exit(0 if d['actions'] and d['decisions'] else 1)"
          minutely list
          minutely actions --json > /dev/null
          minutely export --format html -o /tmp/minutes.html
          grep -q '<!doctype html>' /tmp/minutes.html
          minutely import src/minutely/data/demo.vtt --title "CI import" --process --json > /dev/null
          minutely show --format md | grep -q '## Action points'
          # The Teams commands must be reachable without a tenant, and must say
          # what to do rather than stack-trace when nothing is configured.
          minutely teams status | grep -q 'application id'
          minutely teams --help > /dev/null
          minutely templates | grep -q standup
          # Typed notes are the spine of the document: prove they reach it.
          minutely notes --set 'Pricing
          TODO: Sam: circulate the credit mechanics' > /dev/null
          minutely minutes --template client --format md > /tmp/client.md
          grep -q '## Commitments' /tmp/client.md
          grep -q 'circulate the credit mechanics' /tmp/client.md
          minutely share --to nobody@example.com --dry-run | grep -q 'nothing was sent'

  no-real-recordings:
    if: >-
      github.event_name != 'push'
      || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    # minutely handles recordings of real conversations. .gitignore only
    # protects files nobody force-added, so this is the tripwire.
    runs-on: ubuntu-latest
    defaults:
      run:
        # These checks reason about repo-root-relative paths, so they must not
        # run from the subdirectory.
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Check for tracked recordings, transcripts, or databases
        run: |
          leaked=$(git ls-files --full-name -- ':/meeting-minutes/**' \
            | grep -E '\.(webm|ogg|oga|m4a|mp3|wav|flac|sqlite3)$|\.(vtt|srt)$' \
            | grep -v '^meeting-minutes/src/minutely/data/demo\.vtt$' \
            || true)
          if [ -n "$leaked" ]; then
            echo "::error::audio, transcript, or database files are tracked under meeting-minutes" >&2
            echo "$leaked" >&2
            exit 1
          fi
          echo "only the synthetic demo transcript is tracked"

      # The Teams integration stores a Microsoft refresh token. It lives in the
      # data directory, never the repo, and this is the tripwire for that.
      - name: Check for tracked Microsoft tokens
        run: |
          tokens=$(git ls-files --full-name -- ':/meeting-minutes/**' \
            | grep -E '(^|/)(teams-token|token)\.json$' || true)
          if [ -n "$tokens" ]; then
            echo "::error::a Microsoft token file is tracked under meeting-minutes" >&2
            echo "$tokens" >&2
            exit 1
          fi
          echo "no token files tracked"
