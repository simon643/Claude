[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apflow"
version = "0.1.0"
description = "Approval workflows and spend control for a Xero ledger: approval matrices, budget checking, delegation, and a tamper-evident audit trail."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
keywords = ["xero", "approvals", "accounts-payable", "spend-control", "workflow", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]

# Deliberately zero runtime dependencies. This app holds approval evidence and
# OAuth tokens on a personal machine; every dependency is a supply-chain path
# to both. The Xero client uses urllib, the UI is served by http.server, mail
# goes through smtplib, and storage is sqlite3 — all standard library.
# `pip install -e .` pulls nothing.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
apflow = "apflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/apflow"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B904", "SIM105"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
