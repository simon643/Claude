[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xerobk"
version = "0.1.0"
description = "Local-first bookkeeping companion for Xero: reporting, invoice/bill review, bank coding, and an Australian month-end close checklist."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
keywords = ["xero", "bookkeeping", "accounting", "reconciliation", "bas", "gst"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]

# Deliberately zero runtime dependencies. This app handles financial data on a
# personal machine; every dependency is a supply-chain path to that data. The
# live Xero client uses urllib from the standard library, the UI is served by
# http.server, and storage is sqlite3. `pip install -e .` pulls nothing.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
xerobk = "xerobk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xerobk"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B904", "SIM105"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
